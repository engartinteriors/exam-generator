<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interactive Exam Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        .config-panel { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; background: #eef2f5; padding: 20px; border-radius: 8px; }
        input, select, button { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #3498db; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .question-card { background: #fafafa; border-left: 4px solid #3498db; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .option-btn { background: white; border: 1px solid #ddd; text-align: left; cursor: pointer; color: #333; }
        .option-btn:hover { background: #e3f2fd; }
        .selected { background: #bbdefb; border-color: #2196f3; font-weight: bold; }
        .correct { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #2e7d32; }
        .wrong { background: #ffcdd2 !important; border-color: #f44336 !important; color: #c62828; }
        #score-box { font-size: 20px; font-weight: bold; margin-top: 20px; text-align: center; display: none; }
        @media print {
            .config-panel, button, #submit-btn { display: none !important; }
            body { background: white; }
            .container { box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Interactive Exam Generator</h1>
    
    <div class="config-panel">
        <input type="password" id="apiKey" placeholder="Enter your Gemini API Key">
        <input type="text" id="topic" placeholder="Exam Subject / Topic (e.g., Grade 4 British Science)">
        <select id="numQuestions">
            <option value="3">3 Questions</option>
            <option value="5">5 Questions</option>
            <option value="10">10 Questions</option>
        </select>
        <button onclick="generateExam()">Generate Interactive Exam</button>
    </div>

    <div id="exam-container"></div>
    <button id="submit-btn" style="display:none; width:100%;" onclick="gradeExam()">Submit Exam</button>
    <div id="score-box"></div>
</div>

<script>
let currentQuestions = [];
let userAnswers = {};

async function generateExam() {
    const apiKey = document.getElementById('apiKey').value;
    const topic = document.getElementById('topic').value || "Grade 4 Mathematics and Science";
    const count = document.getElementById('numQuestions').value;
    const container = document.getElementById('exam-container');
    
    if (!apiKey) return alert("Please enter a valid Gemini API Key.");

    container.innerHTML = "<p>⏳ Generating custom interactive exam with Gemini...</p>";
    document.getElementById('submit-btn').style.display = "none";
    document.getElementById('score-box').style.display = "none";

    const prompt = `Generate a JSON array of ${count} multiple choice questions about '${topic}'.
    Format strictly as JSON without markdown code blocks:
    [
      {
        "question": "Question text here?",
        "options": ["Option A", "Option B", "Option C", "Option D"],
        "answerIndex": 0
      }
    ]`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        
        // Clean markdown formatting if present
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        currentQuestions = JSON.parse(rawText);
        
        renderExam();
    } catch (err) {
        container.innerHTML = `<p style="color:red;">Error generating exam: ${err.message}</p>`;
    }
}

function renderExam() {
    const container = document.getElementById('exam-container');
    container.innerHTML = '';
    userAnswers = {};

    currentQuestions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question-card';
        qDiv.innerHTML = `
            <h3>Q${index + 1}. ${q.question}</h3>
            <div class="options">
                ${q.options.map((opt, oIdx) => `
                    <button class="option-btn" id="q${index}_opt${oIdx}" onclick="selectAnswer(${index}, ${oIdx})">
                        ${String.fromCharCode(65 + oIdx)}. ${opt}
                    </button>
                `).join('')}
            </div>
        `;
        container.appendChild(qDiv);
    });

    document.getElementById('submit-btn').style.display = "block";
}

function selectAnswer(qIdx, optIdx) {
    userAnswers[qIdx] = optIdx;
    
    // Highlight active selection
    const buttons = document.querySelectorAll(`#q${qIdx}_opt0, #q${qIdx}_opt1, #q${qIdx}_opt2, #q${qIdx}_opt3`);
    buttons.forEach((btn, idx) => {
        btn.classList.toggle('selected', idx === optIdx);
    });
}

function gradeExam() {
    let score = 0;
    currentQuestions.forEach((q, index) => {
        const selected = userAnswers[index];
        const correct = q.answerIndex;

        currentQuestions[index].options.forEach((_, optIdx) => {
            const btn = document.getElementById(`q${index}_opt${optIdx}`);
            btn.disabled = true;
            
            if (optIdx === correct) {
                btn.classList.add('correct');
            }
            if (selected === optIdx && selected !== correct) {
                btn.classList.add('wrong');
            }
        });

        if (selected === correct) score++;
    });

    const scoreBox = document.getElementById('score-box');
    scoreBox.style.display = "block";
    scoreBox.innerHTML = `Final Score: ${score} / ${currentQuestions.length}`;
}
</script>

</body>
</html>
