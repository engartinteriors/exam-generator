<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Paper Generator</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }

    /* App Sidebar Controls */
    .controls { flex: 1; max-width: 380px; background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .controls h2 { font-size: 1.25rem; margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: #fff; }

    .timer-card { background: #eff6ff; border: 1px solid #bfdbfe; padding: 16px; border-radius: 8px; text-align: center; margin: 20px 0; }
    .timer-display { font-size: 2rem; font-weight: 700; font-family: monospace; color: var(--primary); margin: 6px 0; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-print { background: #059669; color: white; }

    /* A4 Preview Canvas */
    .preview-container { flex: 2; display: flex; justify-content: center; background: #cbd5e1; padding: 20px; border-radius: 12px; overflow-y: auto; max-height: calc(100vh - 40px); }
    .a4-paper { background: white; width: 210mm; min-height: 297mm; padding: 20mm; border-radius: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }

    /* Header / Letterhead */
    .paper-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; }
    .logo-preview { max-height: 60px; max-width: 140px; object-fit: contain; }
    .header-text { text-align: center; flex: 1; margin: 0 12px; }
    .header-text h1 { font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-text h3 { font-size: 0.95rem; font-weight: 500; color: #334155; margin-top: 2px; }

    .meta-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; border: 1px solid #000; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 20px; }

    /* Question Formatting */
    .section-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; background: #f1f5f9; padding: 4px 8px; margin: 16px 0 10px 0; border-left: 4px solid #000; }
    .question-item { margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; page-break-inside: avoid; }
    .question-head { display: flex; justify-content: space-between; font-weight: 600; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; padding-left: 18px; }
    .answer-space { border-bottom: 1px dashed #cbd5e1; min-height: 45px; margin-top: 8px; }

    /* Print Specific Engine Rules */
    @media print {
      body { padding: 0; background: white; }
      .controls { display: none !important; }
      .preview-container { padding: 0; background: white; overflow: visible; max-height: none; }
      .a4-paper { box-shadow: none; border-radius: 0; width: 100%; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- App Controls -->
  <div class="controls">
    <h2>Paper Generator Controls</h2>

    <div class="form-group">
      <label>School / Institution Name</label>
      <input type="text" id="schoolName" value="Oakridge Primary Academy" oninput="renderPaper()">
    </div>

    <div class="form-group">
      <label>Upload Logo</label>
      <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(event)">
    </div>

    <div class="form-group">
      <label>Syllabus Standard</label>
      <select id="syllabus" onchange="generateNewQuestions()">
        <option value="cbse">CBSE Standard</option>
        <option value="icse">ICSE Standard</option>
        <option value="british">British Curriculum (KS2)</option>
        <option value="ib">IB Primary Years (PYP)</option>
      </select>
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex:1;">
        <label>Grade Level</label>
        <select id="grade" onchange="generateNewQuestions()">
          <option value="3">Grade 3</option>
          <option value="4">Grade 4</option>
        </select>
      </div>

      <div class="form-group" style="flex:1;">
        <label>Difficulty</label>
        <select id="difficulty" onchange="generateNewQuestions()">
          <option value="Easy">Easy</option>
          <option value="Medium" selected>Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Subject</label>
      <select id="subject" onchange="generateNewQuestions()">
        <option value="Mathematics">Mathematics</option>
        <option value="Science">Science / Environmental Studies</option>
        <option value="English">English Grammar & Usage</option>
      </select>
    </div>

    <!-- Live Timer Card -->
    <div class="timer-card">
      <label style="font-size: 0.8rem; font-weight: bold; color: #1e40af;">EXAM TIMER</label>
      <div class="timer-display" id="timerDisplay">30:00</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="toggleTimer()" id="timerBtn" style="margin: 0;">Start Timer</button>
        <button class="btn btn-secondary" onclick="resetTimer()" style="margin: 0;">Reset</button>
      </div>
    </div>

    <button class="btn btn-primary" onclick="generateNewQuestions()">🎲 Generate New Paper</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Download PDF / Print</button>
  </div>

  <!-- Printable A4 Paper Preview Container -->
  <div class="preview-container">
    <div class="a4-paper" id="paperContent">
      <div>
        <div class="paper-header">
          <img id="paperLogo" class="logo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>" alt="Logo">
          <div class="header-text">
            <h1 id="paperSchool">Oakridge Primary Academy</h1>
            <h3 id="paperTitle">Term Evaluation Question Paper</h3>
          </div>
          <div style="width: 60px;"></div>
        </div>

        <div class="meta-grid">
          <div><strong>Student Name:</strong> ___________________________</div>
          <div><strong>Date:</strong> ______________</div>
          <div><strong>Subject:</strong> <span id="metaSubject">Mathematics</span> | <strong>Grade:</strong> <span id="metaGrade">3</span></div>
          <div><strong>Time Allowed:</strong> <span id="metaTime">30 Mins</span></div>
          <div><strong>Syllabus:</strong> <span id="metaSyllabus">CBSE</span></div>
          <div><strong>Total Marks:</strong> 25 Marks</div>
        </div>

        <div id="questionContainer"></div>
      </div>

      <div style="text-align: center; font-size: 0.75rem; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px;">
        Page 1 of 1 — Confidential Exam Assessment Paper
      </div>
    </div>
  </div>

  <script>
    let logoDataUrl = "";
    let timerInterval = null;
    let timerSeconds = 1800;
    let isTimerRunning = false;
    let currentQuestions = [];

    const questionBank = {
      Mathematics: {
        3: [
          { type: 'mcq', q: 'What is the place value of 7 in 4,782?', opts: ['70', '700', '7', '7000'], m: 2 },
          { type: 'mcq', q: 'Solve: 458 + 239 = ?', opts: ['697', '687', '797', '695'], m: 2 },
          { type: 'short', q: 'A farmer has 124 apples. He buys 86 more. How many apples does he have in total?', m: 3 },
          { type: 'short', q: 'Write the number name for 3,049 and state if it is even or odd.', m: 3 },
          { type: 'word', q: 'An omnibus has 48 seats. If 3 full buses arrive at a museum, how many students are visiting?', m: 5 }
        ],
        4: [
          { type: 'mcq', q: 'What is the product of 15 and 60?', opts: ['900', '850', '9000', '750'], m: 2 },
          { type: 'mcq', q: 'Which fraction is equivalent to 2/4?', opts: ['1/3', '1/2', '3/4', '2/8'], m: 2 },
          { type: 'short', q: 'Divide 456 by 4. Show your step-by-step working out.', m: 3 },
          { type: 'short', q: 'Calculate the perimeter of a rectangle with length 12 cm and width 7 cm.', m: 3 },
          { type: 'word', q: 'Sarah bought 3 notebooks for £4.50 each and a pen for £1.80. How much change does she get from a £20 note?', m: 5 }
        ]
      },
      Science: {
        3: [
          { type: 'mcq', q: 'Which part of a plant absorbs water and nutrients from the soil?', opts: ['Leaves', 'Stem', 'Roots', 'Flower'], m: 2 },
          { type: 'mcq', q: 'Which animal is classified as a herbivore?', opts: ['Lion', 'Cow', 'Eagle', 'Shark'], m: 2 },
          { type: 'short', q: 'Name three basic things plants need to perform photosynthesis.', m: 3 },
          { type: 'short', q: 'Explain the main difference between solids and liquids.', m: 3 },
          { type: 'word', q: 'Describe the water cycle stage when water vapor turns back into liquid droplets to form clouds.', m: 5 }
        ],
        4: [
          { type: 'mcq', q: 'Which organ pumps blood throughout the human body?', opts: ['Lungs', 'Brain', 'Heart', 'Stomach'], m: 2 },
          { type: 'mcq', q: 'What state of matter is water vapor?', opts: ['Solid', 'Liquid', 'Gas', 'Plasma'], m: 2 },
          { type: 'short', q: 'What is an ecosystem? Give one example of a land ecosystem.', m: 3 },
          { type: 'short', q: 'Why do electrical conductors differ from insulators? Name one conductor.', m: 3 },
          { type: 'word', q: 'Design a simple food chain containing a producer, a primary consumer, and a secondary consumer.', m: 5 }
        ]
      },
      English: {
        3: [
          { type: 'mcq', q: 'Identify the proper noun in the sentence: "Lucy went to London."', opts: ['went', 'Lucy', 'to', 'girl'], m: 2 },
          { type: 'mcq', q: 'What is the correct plural of "child"?', opts: ['Childs', 'Children', 'Childrens', 'Childes'], m: 2 },
          { type: 'short', q: 'Rewrite the sentence using proper punctuation: "where are my red shoes asked tom"', m: 3 },
          { type: 'short', q: 'Choose three adjectives to describe a stormy ocean.', m: 3 },
          { type: 'word', q: 'Write a short paragraph (3-4 sentences) describing your favorite animal using at least two adverbs.', m: 5 }
        ],
        4: [
          { type: 'mcq', q: 'Which word is a synonym for "enormous"?', opts: ['Tiny', 'Huge', 'Fast', 'Quiet'], m: 2 },
          { type: 'mcq', q: 'Identify the conjunction: "We wanted to play outside, but it started raining."', opts: ['wanted', 'outside', 'but', 'raining'], m: 2 },
          { type: 'short', q: 'Convert the following sentence to past continuous tense: "He plays football in the garden."', m: 3 },
          { type: 'short', q: 'Underline the prepositional phrase: "The sneaky cat slept under the wooden porch."', m: 3 },
          { type: 'word', q: 'Write a persuasive paragraph explaining why elementary schools should have longer break times.', m: 5 }
        ]
      }
    };

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          logoDataUrl = e.target.result;
          document.getElementById('paperLogo').src = logoDataUrl;
        };
        reader.readAsDataURL(file);
      }
    }

    function generateNewQuestions() {
      const subject = document.getElementById('subject').value;
      const grade = document.getElementById('grade').value;
      
      const pool = questionBank[subject][grade] || [];
      currentQuestions = [...pool].sort(() => Math.random() - 0.5);
      renderPaper();
    }

    function renderPaper() {
      document.getElementById('paperSchool').innerText = document.getElementById('schoolName').value || 'Primary Academy';
      
      const subj = document.getElementById('subject').value;
      const gr = document.getElementById('grade').value;
      const syl = document.getElementById('syllabus').options[document.getElementById('syllabus').selectedIndex].text;
      
      document.getElementById('metaSubject').innerText = subj;
      document.getElementById('metaGrade').innerText = gr;
      document.getElementById('metaSyllabus').innerText = syl.split(' ')[0];
      document.getElementById('paperTitle').innerText = `${subj} — ${syl} Assessment`;

      const container = document.getElementById('questionContainer');
      container.innerHTML = '';

      if (currentQuestions.length === 0) generateNewQuestions();

      let sectionA = '<div class="section-title">Section A: Multiple Choice Questions</div>';
      let sectionB = '<div class="section-title">Section B: Short Answer & Reasoning</div>';

      currentQuestions.forEach((q, index) => {
        let qHtml = `<div class="question-item">
          <div class="question-head">
            <span>Q${index + 1}. ${q.q}</span>
            <span>[${q.m} Marks]</span>
          </div>`;

        if (q.type === 'mcq') {
          qHtml += `<div class="options-grid">
            ${q.opts.map((opt, i) => `<div>(${String.fromCharCode(65 + i)}) ${opt}</div>`).join('')}
          </div>`;
        } else {
          qHtml += `<div class="answer-space"></div>`;
        }
        
        qHtml += `</div>`;

        if (q.type === 'mcq') sectionA += qHtml;
        else sectionB += qHtml;
      });

      container.innerHTML = sectionA + sectionB;
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timerDisplay').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timerBtn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        btn.innerText = "Start Timer";
      } else {
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            alert("Exam Time is Up!");
          }
        }, 1000);
        btn.innerText = "Pause Timer";
      }
      isTimerRunning = !isTimerRunning;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 1800;
      document.getElementById('timerBtn').innerText = "Start Timer";
      updateTimerDisplay();
    }

    generateNewQuestions();
  </script>
</body>
</html>
